<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChiyaPay — Tea Stall Checkout</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #f4efe6;
      color: #2b2118;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 2rem;
      width: min(92vw, 380px); text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }
    .emoji { font-size: 4rem; line-height: 1; margin: .25rem 0; }
    h1 { margin: .25rem 0 .1rem; font-size: 1.5rem; }
    .price { font-size: 2rem; font-weight: 700; margin: .5rem 0 0; }
    .price small { font-size: 1rem; font-weight: 500; color: #7a6a55; }
    .net {
      display: inline-block; margin-top: .4rem; padding: .15rem .6rem;
      font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
      background: #ece3d2; color: #7a6a55; border-radius: 999px;
    }
    button {
      margin-top: 1.5rem; width: 100%; padding: .9rem;
      font-size: 1.05rem; font-weight: 600; color: #fff;
      background: #b5651d; border: 0; border-radius: 12px; cursor: pointer;
    }
    button:hover { background: #9c531a; }
    #status { margin-top: 1rem; min-height: 1.2rem; color: #7a6a55; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" id="emoji">☕</div>
    <h1 id="item">Loading…</h1>
    <p class="price"><span id="price">—</span> <small>USDC</small></p>
    <span class="net" id="net">devnet</span>
    <button id="pay">Pay with USDC</button>
    <p id="status"></p>
  </main>

  <script>
    // M1: just render item + price from the server config. The Pay button is a
    // placeholder here; the Solana Pay QR flow is wired up in milestone M2.
    async function load() {
      try {
        const cfg = await (await fetch('/api/config')).json();
        document.getElementById('emoji').textContent = cfg.item.emoji;
        document.getElementById('item').textContent = cfg.item.name;
        document.getElementById('price').textContent = cfg.priceUsdc.toFixed(2);
        document.getElementById('net').textContent = cfg.network;
        document.title = 'ChiyaPay — ' + cfg.item.name;
      } catch (e) {
        document.getElementById('status').textContent = 'Could not load shop config.';
      }
    }
    document.getElementById('pay').addEventListener('click', () => {
      document.getElementById('status').textContent = 'Payment flow arrives in M2 ☕';
    });
    load();
  </script>
</body>
</html>
